<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DKTE Placements - Register</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
        }
        .container {
            display: flex;
            height: 100vh;
        }
        .left-panel {
            background-color: #3546ab;
            color: white;
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;
        }
        .left-panel img {
            max-width: 220px;
            margin-bottom: 20px;
        }
        .left-panel h1 {
            font-size: 24px;
            margin-bottom: 10px;
        }
        .left-panel p {
            font-size: 16px;
            line-height: 1.5;
        }
        .right-panel {
            flex: 2;
            background-color: white;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .form-container {
            width: 100%;
            max-width: 400px;
        }
        .form-container h2 {
            margin-bottom: 20px;
            font-size: 22px;
            text-align: center;
            color: #3546ab;
        }
        .tabs {
            text-align: center;
            margin-bottom: 20px;
        }
        .t1 {
            background-color: #3546ab;
            color: white;
            border: none;
            padding: 5px 10px;
            font-size: 12px;
            cursor: pointer;
            border-radius: 3px;
            margin: 0 5px;
            transition: background-color 0.3s ease;
        }
        .t1.active {
            background-color: #223091;
        }
        .form-group {
            margin-bottom: 15px;
            padding: 5px;
        }
        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-size: 14px;
        }
        .form-group input {
            width: 100%;
            padding: 10px;
            font-size: 14px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }
        .form-group input:focus {
            border-color: #3546ab;
            outline: none;
        }
        .recaptcha {
            display: flex;
            align-items: center;
            margin-bottom: 20px;
        }
        .recaptcha input {
            margin-right: 10px;
        }
        .buttons {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .buttons a {
            font-size: 14px;
            text-decoration: none;
            color: #3546ab;
        }
        .buttons a:hover {
            text-decoration: underline;
        }
        .buttons button {
            background-color: #3546ab;
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
            border-radius: 5px;
        }
        .buttons button:disabled {
            background-color: #7a88d2;
            cursor: not-allowed;
        }
    </style>

    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js"></script> 
</head>

<body>
    <div class="container">
        <div class="left-panel">
            <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQWPjhJ83dzE3RJupu2GV1BmGVnR4zbPnaSJg&s" alt="DKTE Logo">
            <h1>DKTE Placements</h1>
            <p>One stop portal for students & companies for placements.</p>
        </div>

        <div class="right-panel">
            <div class="form-container">
                <h2>Register</h2>
                <div class="tabs">
                    <button class="t1 active" onclick="setRole('student', this)">Student</button>
                    <button class="t1" onclick="setRole('recruiter', this)">Recruiter</button>
                    <button class="t1" onclick="setRole('company', this)">Company</button>
                    <button class="t1" onclick="setRole('verifier', this)">Verifier</button>
                </div>
                <form id="registerForm">
                    <div class="form-group">
                        <label for="email">Email:</label>
                        <input type="email" id="email" name="email" placeholder="Enter your email" required>
                    </div>
                    <div class="form-group">
                        <label for="idInput">Roll No:</label>
                        <input type="text" id="idInput" name="idInput" placeholder="Enter your roll number" required>
                    </div>
                    <div class="form-group">
                        <label for="password">Password:</label>
                        <input type="password" id="password" name="password" placeholder="Enter your password" required>
                    </div>
                    <div class="recaptcha">
                        <input type="checkbox" id="recaptcha" required>
                        <label for="recaptcha">I am not a robot</label>
                    </div>
                    <div class="buttons">
                        <button type="submit" id="submitBtn">Register</button>
                        <a href="signin.html">Back to Sign In</a>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script>
        // Firebase Config
        const firebaseConfig = {
            apiKey: "AIzaSyDKbEyYO43oYfjmvIYsy9JkdaPte_8IxrE",
            authDomain: "job-portal-e54bf.firebaseapp.com",
            projectId: "job-portal-e54bf",
            storageBucket: "job-portal-e54bf.appspot.com",
            messagingSenderId: "621351469708",
            appId: "1:621351469708:web:6c2238035ae090a951f1a9",
            measurementId: "G-60QEXBN579"
        };

        // Initialize Firebase
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        let selectedRole = 'student'; // Default role

        function setRole(role, button) {
            selectedRole = role;

            // Update label and placeholder dynamically
            const idLabel = document.querySelector('label[for="idInput"]');
            const idInput = document.getElementById('idInput');

            if (role === 'student') {
                idLabel.textContent = 'Roll No:';
                idInput.placeholder = 'Enter your roll number';
            } else if (role === 'recruiter') {
                idLabel.textContent = 'Recruiter ID:';
                idInput.placeholder = 'Enter your recruiter ID';
            } else if (role === 'company') {
                idLabel.textContent = 'Company ID:';
                idInput.placeholder = 'Enter your company ID';
            } else if (role === 'verifier') {
                idLabel.textContent = 'Verifier ID:';
                idInput.placeholder = 'Enter your verifier ID';
            }

            // Highlight selected role button
            document.querySelectorAll('.t1').forEach(btn => btn.classList.remove('active'));
            button.classList.add('active');
        }

        document.getElementById('registerForm').addEventListener('submit', async function(event) {
            event.preventDefault();

            const email = document.getElementById('email').value.trim();
            const idInput = document.getElementById('idInput').value.trim();
            const password = document.getElementById('password').value.trim();
            const recaptcha = document.getElementById('recaptcha').checked;
            const submitBtn = document.getElementById('submitBtn');

            if (!email || !idInput || !password || !recaptcha) {
                alert('Please fill all fields and verify the captcha.');
                return;
            }

            submitBtn.disabled = true; // Disable button to avoid multiple clicks

            try {
                const userRef = db.collection('users').doc(selectedRole).collection('accounts').doc(idInput);
                const docSnap = await userRef.get();

                if (docSnap.exists) {
                    alert('User already exists with this ID!');
                } else {
                    await userRef.set({
                        email: email,
                        password: password, // Ideally, NEVER store passwords in Firestore directly.
                        createdAt: firebase.firestore.FieldValue.serverTimestamp()
                    });
                    alert('Registration successful!');
                    window.location.href = "signin.html";
                }
            } catch (error) {
                console.error('Error during registration:', error);
                alert('Registration failed. Please try again.');
            } finally {
                submitBtn.disabled = false;
            }
        });
    </script>
</body>
</html>
